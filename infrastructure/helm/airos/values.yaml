replicaCount:
  api: 3
  frontend: 2
  worker: 2

image:
  repository: airos
  tag: latest
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: airos.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: airos-tls
      hosts:
        - airos.example.com

resources:
  api:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

autoscaling:
  enabled: true
  minReplicas:
    api: 3
    frontend: 2
  maxReplicas:
    api: 20
    frontend: 10

postgresql:
  enabled: true
  auth:
    postgresPassword: changeme

redis:
  enabled: true
