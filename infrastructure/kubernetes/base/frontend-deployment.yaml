apiVersion: apps/v1
kind: Deployment
metadata:
  name: airos-frontend
  namespace: airos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airos
      component: frontend
  template:
    metadata:
      labels:
        app: airos
        component: frontend
    spec:
      containers:
        - name: frontend
          image: airos-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://airos-api:8000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: airos-frontend
  namespace: airos
spec:
  selector:
    app: airos
    component: frontend
  ports:
    - port: 3000
      targetPort: 3000
