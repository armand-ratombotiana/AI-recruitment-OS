apiVersion: apps/v1
kind: Deployment
metadata:
  name: airos-api
  namespace: airos
  labels:
    app: airos
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: airos
      component: api
  template:
    metadata:
      labels:
        app: airos
        component: api
    spec:
      containers:
        - name: api
          image: airos-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: airos-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: airos-secrets
                  key: redis-url
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: airos-api
  namespace: airos
spec:
  selector:
    app: airos
    component: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: airos-api-hpa
  namespace: airos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: airos-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
