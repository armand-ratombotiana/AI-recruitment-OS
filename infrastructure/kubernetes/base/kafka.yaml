apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: airos-kafka
  namespace: default
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: "3.7"
      log.retention.hours: 168
      log.segment.bytes: 1073741824
      log.retention.check.interval.ms: 300000
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 50Gi
          deleteClaim: false
          class: gp3-encrypted
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 20Gi
      deleteClaim: false
      class: gp3-encrypted
    resources:
      requests:
        cpu: 250m
      limits:
        cpu: 500m
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: airos-recruitment-events
  labels:
    strimzi.io/cluster: airos-kafka
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: 604800000
    cleanup.policy: delete
    compression.type: lz4
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: airos-ai-events
  labels:
    strimzi.io/cluster: airos-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 259200000
    cleanup.policy: compact,delete
    compression.type: lz4
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: airos-notification-events
  labels:
    strimzi.io/cluster: airos-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 86400000
    cleanup.policy: delete
    compression.type: lz4
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: airos-audit-log
  labels:
    strimzi.io/cluster: airos-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 7776000000
    cleanup.policy: compact
    compression.type: lz4
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: airos-dead-letter
  labels:
    strimzi.io/cluster: airos-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: airos-service-user
  labels:
    strimzi.io/cluster: airos-kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: airos-recruitment-events
          patternType: literal
        operations:
          - Create
          - Describe
          - Read
          - Write
      - resource:
          type: topic
          name: airos-ai-events
          patternType: literal
        operations:
          - Create
          - Describe
          - Read
          - Write
      - resource:
          type: topic
          name: airos-notification-events
          patternType: literal
        operations:
          - Create
          - Describe
          - Read
          - Write
      - resource:
          type: topic
          name: airos-audit-log
          patternType: literal
        operations:
          - Create
          - Describe
          - Write
      - resource:
          type: topic
          name: airos-dead-letter
          patternType: literal
        operations:
          - Create
          - Describe
          - Write
      - resource:
          type: group
          name: '*'
          patternType: literal
        operations:
          - Read
