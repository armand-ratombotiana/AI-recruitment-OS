# =============================================================================
# Kubernetes Base — API Gateway Deployment
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airos-api-gateway
  namespace: airos
  labels:
    app: airos
    component: api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: airos
      component: api-gateway
  template:
    metadata:
      labels:
        app: airos
        component: api-gateway
    spec:
      serviceAccountName: airos-api
      containers:
        - name: api-gateway
          image: airos-api:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: airos-config
            - secretRef:
                name: airos-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: airos-api-gateway
  namespace: airos
spec:
  selector:
    app: airos
    component: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: airos-api-gateway
  namespace: airos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: airos-api-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: active_connections
        target:
          type: AverageValue
          averageValue: "100"
