apiVersion: apps/v1
kind: Deployment
metadata:
  name: airos-beat
  labels:
    app: airos-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airos-beat
  template:
    metadata:
      labels:
        app: airos-beat
    spec:
      containers:
        - name: celery-beat
          image: airos-backend:latest
          command:
            - celery
            - -A
            - shared.events.celery_app
            - beat
            - --loglevel=info
            - --schedule=/tmp/celerybeat-schedule
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: airos-secrets
                  key: celery-broker-url
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: airos-secrets
                  key: celery-result-backend
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: beat-schedule
              mountPath: /tmp
      volumes:
        - name: beat-schedule
          emptyDir: {}
