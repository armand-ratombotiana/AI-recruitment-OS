apiVersion: apps/v1
kind: Deployment
metadata:
  name: airos-worker-default
  labels:
    app: airos-worker
    queue: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: airos-worker
      queue: default
  template:
    metadata:
      labels:
        app: airos-worker
        queue: default
    spec:
      containers:
        - name: celery-worker
          image: airos-backend:latest
          command:
            - celery
            - -A
            - shared.events.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - --queues=default
            - --hostname=default-worker@%h
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: airos-secrets
                  key: celery-broker-url
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                secretKeyRef:
                  name: airos-secrets
                  key: celery-result-backend
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: airos-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: airos-secrets
                  key: redis-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - shared.events.celery_app
                - inspect
                - ping
                - --timeout=5
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - shared.events.celery_app
                - inspect
                - ping
                - --timeout=5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
