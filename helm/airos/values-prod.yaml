# =============================================================================
# AI-ROS Helm Values — Production
# =============================================================================

replicaCount:
  api: 3
  worker: 3
  frontend: 2

image:
  tag: "v1.0.0"
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "airos-api"
  hosts:
    - host: app.airos.com
      paths:
        - path: /api
          pathType: Prefix
          service: airos-api
          port: 8000
        - path: /ws
          pathType: Prefix
          service: airos-api
          port: 8000
        - path: /
          pathType: Prefix
          service: airos-frontend
          port: 3000
  tls:
    - secretName: airos-tls
      hosts:
        - app.airos.com

resources:
  api:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  worker:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "3"
      memory: 2Gi
  frontend:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

autoscaling:
  enabled: true
  api:
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  worker:
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
  frontend:
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

env:
  ENVIRONMENT: "production"
  DEBUG: "false"
  WEB_CONCURRENCY: "4"
  NEXT_PUBLIC_API_URL: "https://app.airos.com"
  NEXT_PUBLIC_WS_URL: "wss://app.airos.com"

persistence:
  postgres:
    enabled: true
    size: 50Gi
  redis:
    enabled: true
    size: 10Gi

postgresql:
  primary:
    persistence:
      size: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 4Gi

redis:
  master:
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

worker:
  command:
    - celery
    - -A
    - shared.events.celery_app
    - worker
    - -l
    - warning
    - -Q
    - default,ai,evaluation,ingestion,notification
    - -c
    - "4"
