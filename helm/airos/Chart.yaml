apiVersion: v2
name: airos
description: AI-Native Recruitment Operating System
type: application
version: 0.2.0
appVersion: "1.0.0"
keywords:
  - ai
  - recruitment
  - platform
home: https://airos.com
sources:
  - https://github.com/airos/ai-recrutement-os
maintainers:
  - name: AI-ROS Team
dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
