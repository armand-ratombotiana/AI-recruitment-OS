apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Values.namespace | default "airos" }}
  labels:
    {{- include "airos.apiLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "airos.apiSelectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.apiPort }}
      targetPort: 8000
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Values.namespace | default "airos" }}
  labels:
    {{- include "airos.frontendLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "airos.frontendSelectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.frontendPort }}
      targetPort: 3000
      protocol: TCP
      name: http
