name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

concurrency:
  group: cd-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - name: Resolve deployment parameters
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deployment summary
        run: |
          echo "## Deployment Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ steps.resolve.outputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Tag | ${{ steps.resolve.outputs.image_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"

  docker-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile.backend
            image: airos-api
          - component: frontend
            dockerfile: Dockerfile.frontend
            image: airos-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ needs.validate.outputs.image_tag }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.environment == 'production' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ needs.validate.outputs.image_tag }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate, docker-push]
    if: needs.validate.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.ai-ros.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name airos-staging --region ${{ env.AWS_REGION }}

      - name: Deploy via Helm
        run: |
          helm upgrade --install airos ./helm/airos \
            --namespace staging --create-namespace \
            --set image.tag=${{ needs.validate.outputs.image_tag }} \
            --set imageFrontend.tag=${{ needs.validate.outputs.image_tag }} \
            --set environment=staging \
            --values ./helm/airos/values.yaml \
            --wait --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/airos-api -n staging --timeout=300s
          kubectl rollout status deployment/airos-frontend -n staging --timeout=300s

      - name: Smoke tests
        run: |
          STAGING_URL="https://staging.ai-ros.com"
          for i in $(seq 1 30); do
            if curl -sf "$STAGING_URL/health" > /dev/null 2>&1; then
              echo "Staging health check passed"
              break
            fi
            [ "$i" -eq 30 ] && echo "Health check failed after 30 attempts" && exit 1
            sleep 10
          done

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, docker-push, deploy-staging]
    if: >-
      always() &&
      needs.validate.outputs.environment == 'production' &&
      needs.docker-push.result == 'success'
    environment:
      name: production
      url: https://ai-ros.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name airos-production --region ${{ env.AWS_REGION }}

      - name: Pre-deploy backup
        run: |
          echo "Creating pre-deploy database backup..."
          kubectl exec -n production deploy/airos-postgres -- \
            pg_dump -U ${{ secrets.POSTGRES_USER }} ${{ secrets.POSTGRES_DB }} | \
            aws s3 cp - s3://${{ secrets.BACKUP_BUCKET }}/pre-deploy/${{ needs.validate.outputs.image_tag }}.sql

      - name: Deploy via Helm (canary)
        run: |
          helm upgrade --install airos ./helm/airos \
            --namespace production --create-namespace \
            --set image.tag=${{ needs.validate.outputs.image_tag }} \
            --set imageFrontend.tag=${{ needs.validate.outputs.image_tag }} \
            --set environment=production \
            --set autoscaling.minReplicas.api=5 \
            --values ./helm/airos/values.yaml \
            --wait --timeout 15m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/airos-api -n production --timeout=600s
          kubectl rollout status deployment/airos-frontend -n production --timeout=300s

      - name: Production smoke tests
        run: |
          PROD_URL="https://ai-ros.com"
          for i in $(seq 1 30); do
            if curl -sf "$PROD_URL/health" > /dev/null 2>&1; then
              echo "Production health check passed"
              break
            fi
            [ "$i" -eq 30 ] && echo "Production health check failed" && exit 1
            sleep 10
          done

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::error::Production deployment failed, initiating rollback"
          helm rollback airos -n production
          kubectl rollout status deployment/airos-api -n production --timeout=300s

  post-deploy:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [validate, deploy-staging, deploy-production]
    if: always() && !cancelled()
    steps:
      - name: Notify deployment status
        run: |
          ENV="${{ needs.validate.outputs.environment }}"
          TAG="${{ needs.validate.outputs.image_tag }}"
          echo "## Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** $ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image Tag:** $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
