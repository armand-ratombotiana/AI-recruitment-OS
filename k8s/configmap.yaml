apiVersion: v1
kind: ConfigMap
metadata:
  name: airos-config
  namespace: airos
  labels:
    app.kubernetes.io/name: airos
    app.kubernetes.io/component: config
data:
  APP_NAME: "AI-ROS"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  DEBUG: "false"
  WEB_CONCURRENCY: "4"
  DATABASE_URL: "postgresql+asyncpg://airos:$(DB_PASSWORD)@airos-postgres:5432/airos"
  REDIS_URL: "redis://airos-redis:6379/0"
  CELERY_BROKER_URL: "redis://airos-redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://airos-redis:6379/2"
  KAFKA_BOOTSTRAP_SERVERS: "airos-kafka:9092"
  ELASTICSEARCH_URL: "http://airos-elasticsearch:9200"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "airos"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://airos-jaeger:4317"
  NEXT_PUBLIC_API_URL: "https://app.airos.com"
  NEXT_PUBLIC_WS_URL: "wss://app.airos.com"
