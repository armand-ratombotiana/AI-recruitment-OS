apiVersion: v1
kind: Service
metadata:
  name: airos-frontend
  namespace: airos
  labels:
    app.kubernetes.io/name: airos
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: airos
    app.kubernetes.io/component: frontend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
