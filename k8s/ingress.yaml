apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airos-ingress
  namespace: airos
  labels:
    app.kubernetes.io/name: airos
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/websocket-services: "airos-api"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
spec:
  ingressClassName: nginx
  tls:
    - secretName: airos-tls
      hosts:
        - app.airos.com
  rules:
    - host: app.airos.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: airos-api
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: airos-api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: airos-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airos-frontend
                port:
                  number: 3000
