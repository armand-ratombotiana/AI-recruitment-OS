[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ros"
version = "1.0.0"
description = "AI-Native Recruitment Operating System"
requires-python = ">=3.12"
license = { text = "Proprietary" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = ["COM812", "ISC001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
