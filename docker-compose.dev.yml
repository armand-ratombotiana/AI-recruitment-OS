# =============================================================================
# AI-ROS — Development Docker Compose (Hot Reload)
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: airos-postgres-dev
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: airos_dev
      POSTGRES_USER: airos
      POSTGRES_PASSWORD: dev_password
    volumes:
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airos"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [dev-net]

  redis:
    image: redis:7-alpine
    container_name: airos-redis-dev
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [dev-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: airos-kafka-dev
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [dev-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: airos-zookeeper-dev
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [dev-net]

  api:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile.dev
    container_name: airos-api-dev
    ports: ["8000:8000"]
    command: uvicorn apps.api_gateway.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://airos:dev_password@postgres:5432/airos_dev
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SECRET_KEY=dev-secret-key-min-32-chars-placeholder!!
      - ENCRYPTION_KEY=dev-encryption-key-32-chars!!
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ENVIRONMENT=development
      - DEBUG=true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend:/app
      - /app/.venv
    networks: [dev-net]

  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile.dev
    container_name: airos-celery-worker-dev
    command: celery -A shared.events.celery_app worker -l info -Q default,ai,evaluation,ingestion,notification -c 2
    environment:
      - DATABASE_URL=postgresql+asyncpg://airos:dev_password@postgres:5432/airos_dev
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./backend:/app
      - /app/.venv
    networks: [dev-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile.dev
    container_name: airos-frontend-dev
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks: [dev-net]

networks:
  dev-net:
    driver: bridge
